<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidatos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topo">
    <div class="container">
        <h1>Candidatos</h1>
        <p>Filtre por nome, cargo ou tempo de experiência.</p>
    </div>
</header>

<main class="container">

    <form class="filtros" id="filtros">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Ana">
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="">Todos os cargos</option>
            </select>
        </div>

        <div class="campo">
            <label for="experienciaMin">Experiência mínima (anos)</label>
            <input type="number" id="experienciaMin" name="experienciaMin" min="0">
        </div>

        <div class="acoes">
            <button type="submit">Filtrar</button>
            <a class="limpar" href="/">Limpar filtros</a>
        </div>
    </form>

    <p class="resultado" id="resultado"></p>
    <section class="grade" id="lista"></section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
